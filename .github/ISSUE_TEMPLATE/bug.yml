name: バグ報告
description: 不具合を報告する
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: バージョン
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
    validations:
      required: true
